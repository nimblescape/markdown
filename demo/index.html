<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>nimblescape Markdown</title>
    <link rel="stylesheet" href="dist/markdown.css" />
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: Canvas;
        color: CanvasText;
      }
      header {
        display: flex;
        gap: 0.75em;
        align-items: center;
        padding: 0.75em 1em;
        border-bottom: 1px solid GrayText;
      }
      header h1 {
        font-size: 1em;
        margin: 0 auto 0 0;
      }
      #status {
        font-size: 0.8em;
        color: GrayText;
      }
      [role='group'] button {
        font: inherit;
        font-size: 0.85em;
        padding: 0.2em 0.6em;
      }
      [role='group'] button[aria-pressed='true'] {
        font-weight: 600;
      }
      main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        min-height: calc(100vh - 3.5em);
      }
      #editor {
        height: calc(100vh - 3.5em);
        padding: 0 2em 1em 0.5em;
        overflow: auto;
        box-sizing: border-box;
      }
      #rendering {
        height: calc(100vh - 3.5em);
        padding: 0 1em 1em;
        overflow: auto;
        box-sizing: border-box;
        border-left: 1px solid GrayText;
      }
      #pages {
        width: 100%;
        height: calc(100vh - 3.5em);
        box-sizing: border-box;
        border: none;
        border-left: 1px solid GrayText;
      }
      #markdown {
        width: 100%;
        box-sizing: border-box;
        border: none;
        border-left: 1px solid GrayText;
        padding: 1em;
        font-family: ui-monospace, monospace;
        font-size: 13px;
        resize: none;
        background: Canvas;
        color: CanvasText;
      }
      @media (max-width: 800px) {
        main {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>nimblescape Markdown</h1>
      <output id="status" aria-live="polite"></output>
      <button id="propose" type="button">Propose changes</button>
      <div role="group" aria-label="The right side">
        <button id="show-text" type="button" aria-pressed="true">Text</button>
        <button id="show-rendering" type="button" aria-pressed="false">Rendering</button>
        <button id="show-pages" type="button" aria-pressed="false">Pages</button>
      </div>
    </header>
    <main>
      <div id="editor"></div>
      <textarea id="markdown" spellcheck="false" aria-label="The Markdown text of the editor"></textarea>
      <div id="rendering" class="nsmd-document nsmd-content" aria-label="The rendering of the renderer" hidden></div>
      <iframe id="pages" title="The pages of the text in the layout plain" hidden></iframe>
    </main>
    <script src="dist/demo.js"></script>
  </body>
</html>
