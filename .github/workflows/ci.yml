# Test the libraries and build their npm packages for every push to main and
# every pull request, on the pinned Node.js release (.node-version). The job
# installs the locked development tools without install scripts, checks the
# types, the code style and the licenses of the libraries (licenses.json,
# R-GEN-011), runs the unit tests, builds the packages of the workspaces, the
# example page and the example extension for VS Code, and packs each package
# with npm pack (R-ARCH-002). The packages stay a workflow artifact for
# inspection. This workflow publishes nothing: the release workflow calls it
# for the commit of a version and publishes the npm packages of that call. A
# change of this file changes the release process: its pull request needs a
# dry run (rule 4 of the release rules in CONTRIBUTING.md).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow calls this workflow for the commit of a version,
  # because its push of that commit starts no workflow.
  workflow_call:
    inputs:
      ref:
        description: The commit to test and package; empty for the commit of the event.
        type: string
        required: false
        default: ''

permissions:
  # Checkout needs repository reads; the checks get no write scope.
  contents: read

jobs:
  test:
    name: Test and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up the pinned Node release
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install the locked development tools without install scripts
        run: npm ci --ignore-scripts

      - name: Check the types
        run: npm run typecheck

      - name: Check the code style
        run: npm run lint

      - name: Check the licenses of the libraries
        run: npm run licenses

      - name: Run the unit tests
        run: npm test

      - name: Build the packages
        run: npm run build

      # The example page bundles all libraries; its build checks that the packages work in a page.
      - name: Build the example page
        run: node esbuild.mjs --demo

      # The example extension bundles the adapter for VS Code; its build checks that the package works in an extension.
      - name: Build the example extension for VS Code
        run: npm run demo:vscode

      - name: Build the npm packages
        run: npm run pack

      - name: Keep the npm packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm
          path: '*.tgz'
          if-no-files-found: error
